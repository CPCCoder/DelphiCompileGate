name: Feature request
description: Propose a focused improvement to DelphiCompileGate
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        DelphiCompileGate supports Delphi 13 Community Edition and strict Protocol 2. Explain any requested contract change explicitly.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the limitation or workflow problem this proposal addresses.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and public API or protocol impact.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List workarounds or smaller approaches you evaluated.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security considerations
      description: Note effects on fail-closed validation, queue files, evidence, or supported targets.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for similar proposals.
          required: true
        - label: This request does not contain a privately reportable vulnerability.
          required: true
