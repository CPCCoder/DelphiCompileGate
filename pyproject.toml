[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delphi_compile_gate"
version = "2.0.0"
description = "Python client for compiling Delphi projects through the DelphiCompileGate IDE plugin"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/CPCCoder/DelphiCompileGate"
Repository = "https://github.com/CPCCoder/DelphiCompileGate.git"
Issues = "https://github.com/CPCCoder/DelphiCompileGate/issues"
Documentation = "https://github.com/CPCCoder/DelphiCompileGate/blob/main/INSTALLATION.md"

[tool.setuptools]
py-modules = ["delphi_compile_gate"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
